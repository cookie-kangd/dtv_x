name: Build and Release (Windows x64)

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0 or 1.0)'
        required: false
        default: 'manual'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protobuf (Windows)
        run: |
          choco install protoc --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\protoc\tools" >> $env:GITHUB_PATH

      - name: Download libmpv-2.dll (MPV 播放内核)
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "dtv-x-ci" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" } | Select-Object -First 1
          if (-not $asset) { throw "mpv-dev asset not found" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z -UserAgent "dtv-x-ci"
          $sz = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sz)) { choco install 7zip --no-progress -y; $sz = "7z" }
          & $sz e mpv-dev.7z -osrc-tauri libmpv-2.dll -y
          if (-not (Test-Path "src-tauri/libmpv-2.dll")) { throw "libmpv-2.dll extraction failed" }
          Get-Item "src-tauri/libmpv-2.dll" | Select-Object Name, Length

      - name: Set rusty_v8 archive (Windows)
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v0.93.1/rusty_v8_release_x86_64-pc-windows-msvc.lib.gz" >> $env:GITHUB_ENV

      - name: Patch tauri config for Windows build
        shell: powershell
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content -Path $path -Raw -Encoding utf8 | ConvertFrom-Json
          if ($null -ne $json.app -and $null -ne $json.app.windows -and $json.app.windows.Count -gt 0) {
            $win0 = $json.app.windows[0]
            $win0 | Add-Member -NotePropertyName decorations -NotePropertyValue $false -Force
          }
          $raw = $json | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($path, $raw, [System.Text.UTF8Encoding]::new($false))

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9  # 锁定 pnpm 9：lockfile 为 9.0，且 pnpm10 会在 CI 下因 ignored build scripts 硬报错

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTY_V8_MIRROR: https://github.com/denoland/rusty_v8/releases/download
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'DTV_X ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## 🎉 DTV_X Release ${{ github.event.inputs.version || github.ref_name }}
            
            ### 📦 安装包下载
            - **Windows**: DTV_X_${{ github.event.inputs.version || github.ref_name }}_x64-setup.exe
            
            ### 🔧 安装说明
            - **Windows**: 下载 .exe 文件，右键以管理员身份运行
          args: --bundles nsis
          releaseDraft: false
          prerelease: false

      - name: 写入中文更新说明（覆盖 release body）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md
