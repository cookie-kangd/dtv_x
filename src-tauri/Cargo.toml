[package]
name = "dtv_x"
version = "0.2.13"
description = "DTV X - Live Stream Client"
authors = ["cookie-kangd"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dtv_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }
prost-build = "0.12"

[dependencies]
# tray-icon：系统托盘（关闭窗口最小化到托盘）；
# image-png / image-ico：让 tauri 能解码打包图标，default_window_icon() 才有值、托盘才有图标
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2.7.0"
# 单实例互斥：同一个 exe 只允许一个进程在跑。
# 没有它时，窗口关到托盘后再次双击快捷方式会开出第二个 DTV_X：
# 两份弹幕监听 + 两个静态图片代理（端口相同会AddrInUse）+ 两套 WebView2，内存直接翻倍。
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
window-vibrancy = "0.7.1"
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0.117"
 md-5 = "0.10.6"
 deno_core = "0.288.0"
 regex = "1.10.4"
 tokio = { version = "1.37.0", features = ["full"] }
 tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
 url = "2.4"
 native-tls = "0.2"
 rand = "0.8"
 futures-util = "0.3"
 urlencoding = "2.1.0"
 percent-encoding = "2.1"
 serde_urlencoded = "0.7"
 reqwest = { version = "0.12", features = ["json", "stream", "cookies", "brotli", "gzip", "blocking"] }
actix-web = "4"
actix-cors = "0.7"
# v0.2.13 移除 awc：源码里已无任何 awc:: 引用（proxy.rs 早已改用 reqwest 流式转发），
# 它是一整套 HTTP 客户端 + TLS 栈，白白拖长编译时间并增大安装包。
bytes = "1"
bytes04 = { package = "bytes", version = "0.4.12" }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
base64 = "0.21"
anyhow = "1.0"
 once_cell = "1.8"
 hex = "0.4"
 http = "0.2" 
 # Huya TARS codec
 tars-stream = "0.1.1"
  
 # Force curl to use platform TLS (SecureTransport on macOS) and avoid OpenSSL linkage
 # Dependencies for Douyin Danmaku
 prost = "0.12"
 prost-types = "0.12"
 flate2 = "1.0"
 lazy_static = "1.4.0"
 chrono = "0.4"
 
 specta = { version = "2.0.0-rc.9", features = ["serde", "derive", "function"] }
 tauri-plugin-os = "2.4.0"
 tungstenite = { version = "0.21", features = ["native-tls"] }
 brotlic = "0.8"
 cookie = "0.18"
 html-escape = "0.2"
rfd = "0.15"
local-ip-address = "0.6"
mdns-sd = "0.13"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
